# Uncomment the following lines to enable the Redox RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Key debounce configuration
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

#Experimental connection stability
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

#Increase BLE transmit power
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#Power saving options
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_PM_SOFT_OFF=y

#CONFIG_ZMK_STUDIO=y
